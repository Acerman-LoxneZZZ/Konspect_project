:root{color-scheme:dark;--bg:#181818;--surface:#1f1f1f;--raised:#272727;--border:#373832;--light:#f2f1eb;--muted:#b0b1a7;--accent:#dbe8b7;--ink:#202822;--paper:#fff;--rule:#e1e5dc;--green:#375443;--ease:cubic-bezier(.22,1,.36,1);font:400 16px/24px Geist,system-ui,sans-serif;background:var(--bg);color:var(--light)}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p,figure,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit;text-underline-offset:4px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #87976f;outline-offset:4px}
.icon{display:inline-block;width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bar{height:64px;border-bottom:1px solid #ffffff13;background:var(--bg);position:sticky;top:0;z-index:2}
.bar-in{height:100%;max-width:1360px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 32px}
.brand{font-size:20px;font-weight:600;line-height:28px;text-decoration:none;display:inline-flex;width:max-content;align-items:center;gap:8px;letter-spacing:-.035em}
.brand-mark{width:24px;height:24px;display:grid;place-items:center;border:1px solid #7c876a;border-radius:4px;color:var(--accent)}
.bar-context{max-width:50vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:14px;line-height:20px}
.bar-action{justify-self:end}
.link-button,.control{min-height:36px;border:1px solid transparent;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;font-size:14px;line-height:20px;font-weight:500;text-decoration:none}
.link-button:hover{background:var(--raised)}
.control{border-color:var(--border);background:var(--surface)}
.control:hover{background:var(--raised)}
.control.primary{background:var(--accent);border-color:var(--accent);color:#242d1d;font-weight:600}
.control.primary:hover{background:#eff5dd}
.control:active,.link-button:active{transform:scale(.98)}
.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.04em}
.home{max-width:720px;margin:0 auto;padding:96px 24px 64px}
.home h1{font-size:60px;line-height:1.02;margin-bottom:12px}
.home-intro{color:var(--muted);margin-bottom:32px}
.picker{border:1px solid var(--border);background:var(--surface);border-radius:16px;overflow:hidden}
.search{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.search input{width:100%;min-width:0;background:transparent;border:0;padding:4px 0;color:var(--light)}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:inset 0 0 0 1px #87976f}
.search input:focus{outline:0}
.search .link-button{padding:4px 8px;min-height:32px;color:var(--accent);white-space:nowrap}

  <header class="document-head">
    <p class="caption">Эндрю Траск · Грокаем глубокое обучение · Глава 1</p>
    <h1 class="serif">Введение в глубокое обучение</h1>
    <p class="deck">Зачем изучать нейросети и с чего начать</p>
  </header>
  <div class="takeaway"><svg class="icon" aria-hidden="true"><use href="#book-icon"/></svg><div><h2>Главная мысль</h2><p>Глубокое обучение помогает автоматизировать отдельные интеллектуальные задачи. Траск предлагает освоить его через практику: собрать простую нейросеть на Python и NumPy, проследить за её вычислениями и постепенно научить её уменьшать ошибку.</p></div></div>
  <section class="topic-section" id="topic-purpose"><header><h2 class="serif">Зачем изучать глубокое обучение</h2><a href="https://manning-content.s3.amazonaws.com/download/d/5d0f2b3-4591-4648-a869-6dafc6f38310/sample_ch01_Trask2_Grokking_Deep-Learning_corr_January06.pdf#page=13" target="_blank" rel="noreferrer">с. 4 ↗</a></header>
    <p>Схожие принципы работы нейросетей применимы в компьютерном зрении, распознавании речи и машинном переводе. Траск видит в этом способ постепенно автоматизировать задачи, для которых раньше требовался человек. В 2019 году он предполагал, что технология может затронуть работу операторов колл-центров, водителей и младших аналитиков.</p>
    <p>Есть и творческая сторона. Траск предлагает представить модель, которая учится рисовать в стиле Моне на примерах картин. Пример показывает, почему автору интересно моделировать человеческие способности.</p>
  </section>
  <section class="topic-section" id="topic-method"><header><h2 class="serif">Как автор предлагает учиться</h2><a href="https://manning-content.s3.amazonaws.com/download/d/5d0f2b3-4591-4648-a869-6dafc6f38310/sample_ch01_Trask2_Grokking_Deep-Learning_corr_January06.pdf#page=14" target="_blank" rel="noreferrer">с. 5–6 ↗</a></header>
    <p>Траск начинает с устройства нейросети. Он сравнивает обучение с вождением: знание конкретной модели автомобиля помогает управлять ею, а сам навык вождения пригодится и на другой машине. Так и здесь: практика с простыми реализациями даёт основу для работы с фреймворками.</p>
    <p>Математику автор объясняет через понятные аналогии. После вводных глав читатель строит небольшие модели и видит, какую задачу решает каждый инструмент и когда он нужен.</p>
    <ol class="sequence"><li><span>Глава 2</span>Разобраться в основных понятиях</li><li><span>Глава 3</span>Собрать сеть, которая выдаёт прогноз</li><li><span>Глава 4</span>Изменить вес сети, чтобы уменьшить ошибку</li></ol>
  </section>
  <section class="topic-section" id="topic-setup"><header><h2 class="serif">Что нужно для старта</h2><a href="https://manning-content.s3.amazonaws.com/download/d/5d0f2b3-4591-4648-a869-6dafc6f38310/sample_ch01_Trask2_Grokking_Deep-Learning_corr_January06.pdf#page=16" target="_blank" rel="noreferrer">с. 7–8 ↗</a></header>
    <p>Для начала хватит школьной алгебры, умения читать графики и основ Python. Траск предлагает просмотреть темы вводного курса Python и проверить, насколько они знакомы.</p>
    <ul><li><strong>Jupyter Notebook</strong> позволяет выполнять код по частям и смотреть промежуточные значения.</li><li><strong>NumPy</strong> даёт операции с массивами и матрицами, из которых можно собрать вычисления сети.</li></ul>
    <p style="margin-top:12px">Примеры в книге написаны на Python 2.7. По словам Траска, он также проверил их на Python 3.</p>
  </section>
  <section class="topic-section" id="own-project"><header><h2 class="serif">Своя задача для практики</h2><a href="https://manning-content.s3.amazonaws.com/download/d/5d0f2b3-4591-4648-a869-6dafc6f38310/sample_ch01_Trask2_Grokking_Deep-Learning_corr_January06.pdf#page=16" target="_blank" rel="noreferrer">с. 7 ↗</a></header>
  <p>Автор советует выбрать вопрос, который тебе действительно интересен, и определить, какие данные помогут на него ответить. Его занимала идея прогнозировать цены акций по сообщениям в Twitter.</p>
  <figure class="diagram" aria-labelledby="diagram-title">

<template id="prediction-content">
  <header class="document-head">
    <p class="caption">Эндрю Траск · Грокаем глубокое обучение · Глава 3</p>
    <h1 class="serif">Прямое распространение</h1>
    <p class="deck">Как нейросеть превращает входные данные в прогноз</p>
  </header>
  <div class="takeaway"><svg class="icon" aria-hidden="true"><use href="#book-icon"/></svg><div><h2>Главная мысль</h2><p>Прямой проход — это вычисление прогноза при заданных весах. Каждый вход умножается на свой вес. Из этих вкладов получается выход, который можно передать дальше по сети.</p></div></div>
  <section class="topic-section" id="topic-forward"><header><h2 class="serif">От одного входа к нескольким</h2></header>
    <p>В простейшем случае прогноз равен произведению входа и веса. Когда входов несколько, каждый даёт свой вклад. Их сумма называется скалярным произведением входов и весов. Три входа в примере — три признака одного наблюдения.</p>
    <div class="equation" aria-label="Прогноз равен сумме произведений входов на веса">ŷ = x₁w₁ + x₂w₂ + x₃w₃</div>
    <div class="code-example" data-code-title="Один вход и несколько входов" data-result="2.0&#10;4.5"><pre><code>x = 4
w = 0.5
print(x * w)

inputs = (4, 3, 2)
weights = (0.5, 1.0, -0.25)
prediction = sum(
    x * w for x, w in zip(inputs, weights)
)
print(prediction)</code></pre></div>
    <p>Второй прогноз складывается из <strong>2 + 3 − 0,5 = 4,5</strong>. Отрицательный вес у третьего признака уменьшает сумму. В этом примере веса мы задали вручную.</p>
  </section>
  <section class="topic-section" id="topic-outputs"><header><h2 class="serif">Несколько выходов и слоёв</h2></header>
    <p>Чтобы получить несколько выходов из одного входа, можно умножить его на несколько разных весов. Если входов и выходов несколько, у каждого выхода появляется собственный набор весов. В матрице весов одна строка соответствует одному выходу.</p>
    <div class="code-example" data-code-title="Два выхода для одного наблюдения" data-result="[4.5, 2.0]"><pre><code>inputs = (4, 3, 2)
weight_rows = ((0.5, 1.0, -0.25), (1.0, 0.0, -1.0))
outputs = [
    sum(x * w for x, w in zip(inputs, row))
    for row in weight_rows
]
print(outputs)</code></pre></div>
    <p>В NumPy та же операция записывается как <code>W @ x</code>, где <code>W</code> — матрица весов, а <code>x</code> — вектор входов. Если слоёв несколько, выход одного слоя становится входом следующего. Число его выходов должно совпадать с числом входов следующего слоя.</p>
    <p><strong>Проверка понимания.</strong> При прямом проходе значения движутся от входа к выходу. Сравнение прогноза с целью и изменение весов появятся в следующей главе.</p>
  </section>
</template>

<template id="descent-content">
  <header class="document-head">
    <p class="caption">Эндрю Траск · Грокаем глубокое обучение · Глава 4</p>
    <h1 class="serif">Градиентный спуск</h1>
    <p class="deck">Как сеть использует ошибку, чтобы обновить вес</p>
  </header>
  <div class="takeaway"><svg class="icon" aria-hidden="true"><use href="#book-icon"/></svg><div><h2>Главная мысль</h2><p>Сначала сеть делает прогноз, затем сравнивает его с правильным ответом. Производная подсказывает, как изменение веса повлияет на ошибку, а скорость обучения задаёт размер шага.</p></div></div>
  <section class="topic-section" id="topic-loss"><header><h2 class="serif">Прогноз и ошибка</h2></header>
    <p>Возьмём один вход <code>x = 2</code>, правильный ответ <code>y = 6</code> и начальный вес <code>w = 2</code>. Модель умножает вход на вес и выдаёт 4. Остаток <code>ŷ − y</code> равен −2, а квадрат ошибки равен 4.</p>
    <div class="equation" aria-label="Прогноз равен икс умножить на вес. Ошибка равна квадрату разности прогноза и цели.">ŷ = xw &nbsp; · &nbsp; E = (ŷ − y)²</div>
    <p>Квадрат одинаково оценивает промах на 2 в обе стороны и сильнее штрафует большие промахи. Чтобы понять, куда менять вес, понадобится знак остатка и то, как сам вход влияет на прогноз.</p>
    <h3>Пробный шаг</h3>
    <p>Можно проверить два соседних веса. При <code>w = 1,9</code> квадрат ошибки равен 4,84, а при <code>w = 2,1</code> — 3,24. Второй шаг уменьшает ошибку. Этот приём требует пересчитать прогноз для каждого пробного веса. Возле минимума фиксированный шаг может оказаться слишком большим.</p>
  </section>
  <section class="topic-section" id="topic-gradient"><header><h2 class="serif">Как изменить вес</h2></header>
    <p>Производная — это наклон ошибки в текущей точке. Положительный наклон означает, что при небольшом увеличении веса ошибка растёт. Отрицательный наклон означает, что при небольшом увеличении веса ошибка уменьшается. Поэтому шаг делают в сторону, противоположную наклону.</p>
    <div class="equation" aria-label="Производная половины квадрата ошибки равна произведению входа на разность прогноза и цели.">L = ½(ŷ − y)² &nbsp; · &nbsp; ∂L/∂w = x(ŷ − y)</div>
    <p>В коде Траска используется выражение <code>x * (prediction - target)</code>. Это точная производная для половины квадрата ошибки. Для полного квадрата появляется множитель 2, который можно учесть в размере шага. Если вход равен нулю, прогноз не зависит от веса и поправка тоже равна нулю.</p>
    <p>В нашем примере производная равна <code>2 × (−2) = −4</code>. При скорости обучения <code>α = 0,1</code> новый вес равен <code>2 − 0,1 × (−4) = 2,4</code>. Прогноз становится 4,8, а квадрат ошибки уменьшается до 1,44.</p>
  </section>
  <section class="topic-section" id="topic-training"><header><h2 class="serif">Цикл обучения на Python</h2></header>
    <p>Каждая строка вывода показывает вес, прогноз и ошибку <strong>до следующего обновления</strong>. Отдельная переменная для остатка позволяет использовать его и для подсчёта ошибки, и для вычисления градиента.</p>
    <div class="code-example" data-code-title="Обучение одного веса" data-result="w=2.000  y=4.000  E=4.0000&#10;w=2.400  y=4.800  E=1.4400&#10;w=2.640  y=5.280  E=0.5184&#10;w=2.784  y=5.568  E=0.1866"><pre><code>x, target = 2.0, 6.0
weight = 2.0
alpha = 0.1

for step in range(4):
    prediction = x * weight
    residual = prediction - target
    error = residual ** 2
    print(
        f"w={weight:.3f}  y={prediction:.3f}  "
        f"E={error:.4f}"
    )
    gradient = x * residual
    weight -= alpha * gradient</code></pre></div>
    <p>Целевой вес для этой задачи равен <strong>3</strong>: при входе 2 он даёт прогноз 6. В цикле вес приближается к нему постепенно.</p>
  </section>
  <section class="topic-section" id="topic-step-size"><header><h2 class="serif">Размер шага и расхождение</h2></header>
    <p>Слишком большой шаг может перескочить минимум. В следующей итерации вес движется обратно, и если шаг снова слишком велик, промах может стать ещё больше. Здесь разницу видно уже после первого обновления.</p>
    <table class="comparison"><caption>После первого обновления</caption><thead><tr><th scope="col">Скорость</th><th scope="col">Вес</th><th scope="col">Прогноз</th><th scope="col">Квадрат ошибки</th></tr></thead><tbody><tr><th scope="row">α = 0,10</th><td>2,4</td><td>4,8</td><td>1,44</td></tr><tr><th scope="row">α = 0,55</th><td>4,2</td><td>8,4</td><td>5,76</td></tr></tbody></table>
    <figure class="chart" aria-labelledby="loss-graph-label">
      <svg viewBox="0 0 600 250" role="img" aria-labelledby="loss-graph-title loss-graph-desc">
        <title id="loss-graph-title">Квадрат ошибки при двух скоростях обучения</title><desc id="loss-graph-desc">На шагах от нуля до четырёх ошибка при скорости 0,10 убывает с 4 до 0,067, а при скорости 0,55 растёт с 4 до 17,199.</desc>
        <g stroke="#dce4d8" stroke-width="1"><path d="M54 42h364M54 92h364M54 142h364M54 192h364"/></g>

        <polyline points="54,158.67 145,180 236,187.68 327,190.44 418,191.44" stroke="#3b714e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="54,158.67 145,144 236,122.88 327,92.47 418,48.67" stroke="#9c5439" stroke-width="3" fill="none" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="418" cy="48.67" r="4" fill="#9c5439"/><circle cx="418" cy="191.44" r="4" fill="#3b714e"/>

      </svg>
      <figcaption id="loss-graph-label">Квадрат ошибки на каждом шаге. Обе линии стартуют с одного веса. Сплошная линия сходится к нулю, пунктирная расходится.</figcaption>
    </figure>
    <p><strong>Попробуй.</strong> Поменяй в примере только <code>alpha</code> на <code>0.55</code> и сравни вывод с графиком. Эти значения относятся к данной учебной задаче: в других моделях подходящий шаг зависит от данных и функции ошибки.</p>
  </section>

<dialog id="book-dialog" aria-labelledby="new-title"><form id="book-form"><h2 id="new-title">Добавить книгу</h2><label for="book-title">Название</label><input id="book-title" required maxlength="120"><label for="book-author">Автор</label><input id="book-author" maxlength="100"><div class="form-actions"><button class="control" type="button" data-close="book-dialog">Отмена</button><button class="control primary" type="submit">Добавить</button></div></form></dialog>

<script>
const $ = (selector) => document.querySelector(selector);
const sourceBook = { id: 'trask', title: 'Грокаем глубокое обучение', author: 'Эндрю Траск', chapters: ['Введение в глубокое обучение', 'Как учатся машины', 'Прямое распространение', 'Градиентный спуск'] };
const sourceUrl = 'https://manning-content.s3.amazonaws.com/download/d/5d0f2b3-4591-4648-a869-6dafc6f38310/sample_ch01_Trask2_Grokking_Deep-Learning_corr_January06.pdf';
const sampleChapters = {
  0: { template: '#chapter-content', source: sourceUrl + '#page=12' },
  2: { template: '#prediction-content', source: 'https://livebook.manning.com/book/grokking-deep-learning/chapter-3' },
  3: {
    template: '#descent-content',
    source: 'https://livebook.manning.com/book/grokking-deep-learning/chapter-4/1',
    topics: [
      { id: 'loss', title: 'Прогноз и ошибка' },
      { id: 'gradient', title: 'Как изменить вес' },
      { id: 'training', title: 'Цикл обучения на Python' },
      { id: 'step-size', title: 'Размер шага и расхождение' },
    ],
  },
};
const namespace = 'polya-reading-room-';

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(namespace + key)) ?? fallback; } catch { return fallback; }
}

function save(key, value) {
  try { localStorage.setItem(namespace + key, JSON.stringify(value)); } catch { /* The current session remains usable. */ }
}

const books = [sourceBook, ...load('books', [])];
const topicOverrides = load('topics', {});
const notes = load('notes', {});
let route = { view: 'home' };
let activeChapter = 0;
let activeBook = null;

function make(tag, className = '', value = '') {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = value;
  return node;
}

function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('aria-hidden', 'true');
  use.setAttribute('href', '#' + name + '-icon');
  svg.append(use);
  return svg;
}

function link(className, label, href) {
  const anchor = make('a', className, label);
  anchor.href = href;
  return anchor;
}

function button(className, label, action) {
  const node = make('button', className, label);
  node.type = 'button';
  node.addEventListener('click', action);
  return node;
}

function keyFor(book, chapter) { return book.id + '/' + chapter; }
function sampleFor(book, chapter) { return book === sourceBook ? sampleChapters[chapter] : undefined; }
function topicsFor(book, chapter) { return topicOverrides[keyFor(book, chapter)] ?? sampleFor(book, chapter)?.topics ?? []; }
function outlineTopics(book, chapter) {
  const sample = sampleFor(book, chapter);
  return sample && !sample.topics ? [] : topicsFor(book, chapter);
}
function chapterUrl(book, chapter, topic) { return `#read/${book.id}/${chapter}${topic ? '/' + topic : ''}`; }
function countTopics(count) {
  if (count % 100 >= 11 && count % 100 <= 14) return `${count} тем`;
  if (count % 10 === 1) return `${count} тема`;
  if ([2, 3, 4].includes(count % 10)) return `${count} темы`;
  return `${count} тем`;
}

function drawBooks() {
  const query = $('#search').value.trim().toLowerCase();
  const results = books.filter((book) => (book.title + ' ' + book.author).toLowerCase().includes(query));
  $('#books').replaceChildren(...results.map((book) => {
    const row = link('book-row', '', '#book/' + book.id);
    const cover = make('span', 'mini-cover', book === sourceBook ? 'DL' : book.title.slice(0, 2));
    cover.setAttribute('aria-hidden', 'true');
    const label = make('span');
    label.append(make('strong', '', book.title));
    if (book.author) label.append(make('span', 'caption', book.author));
    row.append(cover, label, icon('right'));
    return row;
  }));
  if (!results.length) $('#books').append(make('p', 'empty-line', 'Книга не найдена. Можно добавить её по названию.'));
}

function drawContents(book, selected) {
  activeBook = book;
  activeChapter = selected;
  $('#cover-title').textContent = book.title;
  $('#cover-author').textContent = book.author || 'Моя тетрадка';
  $('#contents-count').textContent = book === sourceBook ? 'Эндрю Траск' : book.title;
  $('#edit-topics').hidden = !outlineTopics(book, selected).length && !sampleFor(book, selected)?.topics;
  $('#chapter-list').replaceChildren(...book.chapters.map((chapterTitle, index) => {
    const number = String(index + 1).padStart(2, '0');
    const sample = sampleFor(book, index);
    const themes = outlineTopics(book, index);
    if (sample && !sample.topics) {
      const row = link('chapter chapter-direct', '', chapterUrl(book, index));
      row.setAttribute('aria-label', 'Открыть конспект: ' + chapterTitle);
      row.append(make('span', 'chapter-number', number), make('strong', '', chapterTitle), make('span', 'chapter-count', 'Конспект'), icon('right'));
      return row;
    }
    const group = make('details', sample ? 'chapter chapter-ready' : 'chapter');
    group.name = 'book-chapters';
    group.open = index === selected;
    const summary = make('summary');
    summary.append(make('span', 'chapter-number', number), make('strong', '', chapterTitle), make('span', 'chapter-count', themes.length ? countTopics(themes.length) : 'Без конспекта'), icon('chevron'));
    group.addEventListener('toggle', () => {
      if (group.open) {
        activeChapter = index;
        $('#edit-topics').hidden = !themes.length && !sample?.topics;
      } else if (activeChapter === index) {
        $('#edit-topics').hidden = true;
      }
    });
    const content = make('div', 'chapter-content');
    for (const topic of themes) {
      const item = link('topic', topic.title, chapterUrl(book, index, topic.id));
      item.append(icon('chevron'));
      content.append(item);
    }
    if (sample || themes.length) {
      const item = link('topic chapter-full', 'Открыть конспект', chapterUrl(book, index));
      item.append(icon('right'));
      content.append(item);
    } else {
      content.append(make('p', 'caption', 'У этой главы пока нет конспекта.'), button('control', 'Разбить на темы', () => openTopics(book, index)));
    }
    group.append(summary, content);
    return group;
  }));
}

function addNote(section, id) {
  const label = make('label', '', 'Мои заметки');
  const field = make('textarea', 'own-note');
  const labelId = 'note-' + section.id;
  label.htmlFor = labelId;
  field.id = labelId;
  field.placeholder = 'Добавить мысль или пример';
  field.value = notes[id] ?? '';
  field.addEventListener('input', () => { notes[id] = field.value; save('notes', notes); });
  section.append(label, field);
}

function formatCode(article) {
  const tokens = /("[^"\n]*"|'[^'\n]*'|#[^\n]*|\b(?:for|in|import|as)\b|\b(?:print|range|sum|zip)\b|\b\d+(?:\.\d+)?\b)/g;
  for (const example of article.querySelectorAll('.code-example')) {
    const code = example.querySelector('code');
    const original = code.textContent;
    const heading = make('div', 'code-header');
    const copy = button('copy-code', 'Копировать', async () => {
      try {
        await navigator.clipboard.writeText(original);
        copy.textContent = 'Скопировано';
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(code);
        selection.removeAllRanges();
        selection.addRange(range);
        copy.textContent = 'Код выделен';
      }
      setTimeout(() => { copy.textContent = 'Копировать'; }, 1800);
    });
    heading.append(make('span', '', `Python · ${example.dataset.codeTitle}`), copy);
    example.prepend(heading);
    const output = make('div', 'code-output');
    output.append(make('span', '', 'Вывод'), make('output', '', example.dataset.result));
    example.append(output);
    const highlighted = document.createDocumentFragment();
    let from = 0;
    for (const match of original.matchAll(tokens)) {
      const value = match[0];
      const type = /^['"]/.test(value) ? 'string' : value.startsWith('#') ? 'comment' : /^\d/.test(value) ? 'number' : /^(for|in|import|as)$/.test(value) ? 'keyword' : 'function';
      highlighted.append(original.slice(from, match.index), make('span', 'code-' + type, value));
      from = match.index + value.length;
    }
    highlighted.append(original.slice(from));
    code.replaceChildren(highlighted);
  }
}

function drawReader(book, chapter, topicId) {
  const doc = $('#document');
  const sample = sampleFor(book, chapter);
  const themes = topicsFor(book, chapter);
  doc.replaceChildren();
  if (sample) {
    const template = $(sample.template).content.cloneNode(true);
    for (const theme of themes) {
      const existing = template.getElementById('topic-' + theme.id);
      if (existing) existing.querySelector('h2').textContent = theme.title;
    }
    doc.append(template);
    formatCode(doc);
    const chapterNotes = make('section', 'topic-section chapter-notes');
    chapterNotes.id = 'chapter-notes';
    addNote(chapterNotes, keyFor(book, chapter));
    for (const theme of themes) {
      const key = keyFor(book, chapter) + '/' + theme.id;
      if (sample.topics?.some((item) => item.id === theme.id) || (!sample.topics && !notes[key])) continue;
      const previous = make('div', 'previous-notes');
      previous.id = 'topic-' + theme.id;
      previous.append(make('h3', '', theme.title));
      addNote(previous, key);
      chapterNotes.append(previous);
    }
    doc.append(chapterNotes);
  } else {
    const header = make('header', 'document-head');
    header.append(make('p', 'caption', `Глава ${chapter + 1} · ${book.title}`), make('h1', 'serif', book.chapters[chapter]));
    doc.append(header);
    for (const theme of themes) {
      const section = make('section', 'topic-section');
      section.id = 'topic-' + theme.id;
      section.append(make('h2', 'serif', theme.title));
      addNote(section, keyFor(book, chapter) + '/' + theme.id);
      doc.append(section);
    }
  }
  const footer = make('footer', 'document-footer');
  footer.append(link('', 'К оглавлению', `#book/${book.id}/${chapter}`));
  if (sample) {
    const source = link('', `Глава ${chapter + 1} в издательстве Manning ↗`, sample.source);
    source.target = '_blank';
    source.rel = 'noreferrer';
    footer.append(source);
  }
  doc.append(footer);
  if (book === sourceBook && [2, 3].includes(chapter)) {
    const neighbors = make('nav', 'chapter-neighbors');
    neighbors.setAttribute('aria-label', 'Соседний конспект');
    neighbors.append(chapter === 2 ? link('control', 'Дальше: градиентный спуск →', chapterUrl(book, 3)) : link('control', '← Прямое распространение', chapterUrl(book, 2)));
    doc.append(neighbors);
  }
  requestAnimationFrame(() => {
    if (topicId) document.getElementById('topic-' + topicId)?.scrollIntoView();
  });
}

function render() {
  const [view, id, rawChapter, topic] = location.hash.slice(1).split('/');
  const book = books.find((item) => item.id === id);
  const chapter = Number(rawChapter || 0);
  const validChapter = book?.chapters[chapter] !== undefined;
  route = book && validChapter && ['book', 'read'].includes(view) ? { view, book, chapter, topic } : { view: 'home' };
  $('#home').hidden = route.view !== 'home';
  $('#contents').hidden = route.view !== 'book';
  $('#reader').hidden = route.view !== 'read';
  document.title = route.view === 'read' ? `Глава ${chapter + 1} — ${book.chapters[chapter]}` : 'Поля — тетрадка для чтения';
  $('#download').hidden = route.view !== 'read' || book !== sourceBook || chapter !== 0;
  $('#print-chapter').hidden = route.view !== 'read' || !sampleFor(book, chapter) || chapter === 0;
  const brand = $('#brand');
  brand.href = route.view === 'read' ? `#book/${book.id}/${chapter}` : '#';
  brand.replaceChildren();
  const mark = make('span', 'brand-mark');
  mark.append(icon(route.view === 'read' ? 'back' : 'book'));
  brand.append(mark, document.createTextNode(route.view === 'read' ? 'Оглавление' : 'Поля'));
  $('#bar-context').textContent = route.view === 'home' ? 'Макет тетрадки' : route.view === 'read' ? `Глава ${chapter + 1}` : 'Мои книги';
  window.scrollTo(0, 0);
  if (route.view === 'home') drawBooks();
  if (route.view === 'book') drawContents(book, chapter);
  if (route.view === 'read') drawReader(book, chapter, topic);
}

function openTopics(book, chapter) {
  activeBook = book;
  activeChapter = chapter;
  $('#topics-caption').textContent = `Глава ${chapter + 1} · ${book.chapters[chapter]}`;
  $('#topic-input').value = topicsFor(book, chapter).map((topic) => topic.title).join('\n');
  $('#topics-error').hidden = true;
  $('#topics-dialog').showModal();
}

$('#search').addEventListener('input', drawBooks);
$('#print-chapter').addEventListener('click', () => window.print());
$('#add-book').addEventListener('click', () => $('#book-dialog').showModal());
for (const control of document.querySelectorAll('[data-close]')) control.addEventListener('click', () => document.getElementById(control.dataset.close).close());
$('#book-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const title = $('#book-title').value.trim();
  if (!title) return;
  const book = { id: String(Date.now()), title, author: $('#book-author').value.trim(), chapters: ['Глава 1'] };
  books.push(book);
  save('books', books.slice(1));
  event.target.reset();
  $('#book-dialog').close();
  location.hash = '#book/' + book.id;
});
$('#edit-topics').addEventListener('click', () => openTopics(activeBook, activeChapter));
$('#suggest-topics').addEventListener('click', () => {
  const suggestions = ['Главная мысль', 'Основные понятия', 'Примеры'];
  const lines = $('#topic-input').value.split('\n').map((line) => line.trim()).filter(Boolean);
  $('#topic-input').value = [...new Set([...lines, ...suggestions])].join('\n');
  $('#topic-input').focus();
});
$('#topics-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const before = topicsFor(activeBook, activeChapter);
  const titles = [...new Set($('#topic-input').value.split('\n').map((line) => line.trim()).filter(Boolean))];
  if (titles.length > 16) {
    $('#topics-error').textContent = 'В макете можно добавить до 16 тем.';
    $('#topics-error').hidden = false;
    return;
  }
  const reserved = new Set(titles.map((title) => before.find((item) => item.title === title)?.id).filter(Boolean));
  topicOverrides[keyFor(activeBook, activeChapter)] = titles.map((title, index) => {
    const same = before.find((item) => item.title === title);
    const atIndex = before[index];
    const id = same?.id ?? (atIndex && !reserved.has(atIndex.id) ? atIndex.id : 'custom-' + Date.now() + '-' + index);
    reserved.add(id);
    return { id, title };
  });
  save('topics', topicOverrides);
  $('#topics-dialog').close();
  drawContents(activeBook, activeChapter);
});
